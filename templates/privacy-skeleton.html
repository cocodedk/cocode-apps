<!DOCTYPE html>
<!--
  Privacy policy skeleton. Copy to <site_dir>/privacy/index.html and to <site_dir>/<other>/privacy/index.html.
  Replace APP-NAME, LANG and the explanatory comments with the app's own text, and keep every
  cocode-apps marker comment (nav and footer): tools.render writes into them. English headings below;
  the Danish page uses these, in the same order:
    Resumé
    Hvad der indsamles
    Servere appen kontakter
    Tilladelser
    Hvad der bliver på telefonen
    Tredjeparter
    Dine rettigheder
    Kontakt
    Ændringer
-->
<html lang="LANG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy policy - APP-NAME</title>
</head>
<body>
<!-- cocode-apps:nav:start -->
<!-- cocode-apps:nav:end -->
<main id="main">
  <h1>Privacy policy - APP-NAME</h1>

  <h2>Summary</h2>
  <!-- Two or three sentences: what the app collects and what it does not. -->

  <h2>What is collected</h2>
  <!-- Every kind of data the app handles; say "nothing" if that is the truth. -->

  <h2>Servers the app contacts</h2>
  <!-- Every server the app talks to, and why. Say "none" if the app is offline. -->

  <h2>Permissions</h2>
  <!-- Each Android permission the app asks for, and what it is used for. -->

  <h2>What stays on the phone</h2>
  <!-- Data stored only on the device, and how the user can delete it. -->

  <h2>Third parties</h2>
  <!-- Any third-party service, library with network access, or processor; "none" if none. -->

  <h2>Your rights</h2>
  <!-- Access, correction, deletion and complaint rights, in the words that apply to this app. -->

  <h2>Contact</h2>
  <!-- Who to write to: bb@cocode.dk and the GitHub issues link. -->

  <h2>Changes</h2>
  <!-- How changes to this policy are announced, and the date of the latest change. -->
</main>
<!-- cocode-apps:footer:start -->
<!-- cocode-apps:footer:end -->
</body>
</html>
