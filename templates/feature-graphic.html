<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>{{name}}</title>
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    background: radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 55%), {{bg}};
    color: {{fg}};
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  .icon {
    flex: none;
    width: 280px;
    height: 280px;
    border-radius: 18%;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(128, 128, 128, 0.3);
  }
  .icon svg { display: block; }
  .text { min-width: 0; }
  h1 { margin: 0; font-size: {{name_size}}px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 18px 0 0; font-size: 30px; line-height: 1.3; opacity: 0.86; }
  p:empty { display: none; }
</style>
</head>
<body>
<div class="icon">{{icon}}</div>
<div class="text">
<h1>{{name}}</h1>
<p>{{tagline}}</p>
</div>
</body>
</html>
